<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap');
    </style>
  </defs>

  <!-- Background: cream -->
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- Gold top bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#C9A96E"/>

  <!-- Left gold accent line -->
  <rect x="72" y="80" width="2" height="470" fill="#C9A96E" opacity="0.35"/>

  <!-- Section label -->
  <text
    x="100" y="138"
    font-family="'Jost', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="400"
    letter-spacing="3.5"
    fill="#C9A96E"
    text-anchor="start">HOSPITALITY LEADERSHIP</text>

  <!-- Decorative gold rule under label -->
  <line x1="100" y1="152" x2="340" y2="152" stroke="#C9A96E" stroke-width="1" opacity="0.5"/>

  <!-- Main headline — Line 1 -->
  <text
    x="100" y="240"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="500"
    fill="#1A1714"
    text-anchor="start">The Word</text>

  <!-- Main headline — Line 2 -->
  <text
    x="100" y="320"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="500"
    fill="#1A1714"
    text-anchor="start">No Hospitality Manual</text>

  <!-- Main headline — Line 3 -->
  <text
    x="100" y="400"
    font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif"
    font-size="72"
    font-weight="500"
    fill="#1A1714"
    text-anchor="start">Will Ever Contain</text>

  <!-- Horizontal rule -->
  <line x1="100" y1="435" x2="700" y2="435" stroke="#E8D5B0" stroke-width="1"/>

  <!-- Author name -->
  <text
    x="100" y="476"
    font-family="'Jost', 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="400"
    fill="#1A1714"
    text-anchor="start">Ahmet Can Yesildag</text>

  <!-- Separator dot -->
  <circle cx="275" cy="470" r="2" fill="#C9A96E"/>

  <!-- Date -->
  <text
    x="288" y="476"
    font-family="'Jost', 'Helvetica Neue', Arial, sans-serif"
    font-size="17"
    font-weight="300"
    fill="#7A7369"
    text-anchor="start">May 10, 2026</text>

  <!-- Domain watermark bottom right -->
  <text
    x="1128" y="572"
    font-family="'Jost', 'Helvetica Neue', Arial, sans-serif"
    font-size="13"
    font-weight="300"
    letter-spacing="1"
    fill="#7A7369"
    text-anchor="end">ahmetcanyesildag.com</text>

  <!-- Decorative bottom gold rule -->
  <rect x="0" y="625" width="1200" height="5" fill="#C9A96E"/>
</svg>
